[project]
name = "indobias"
version = "0.1.0"
description = "IndoBias: a dual-track, culturally grounded benchmark for LLM bias evaluation in Indonesian languages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.20.0",
    "ipykernel>=7.2.0",
    "pandas>=2.3.3",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "lmppl>=0.3.2",
    "evaluate>=0.4.6",
    "openpyxl>=3.1.5",
    "openai>=1.0.0",
]

[project.scripts]
indobias = "indobias_qa.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indobias_qa"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.ruff]
extend-exclude = [
    "*.ipynb",
]
